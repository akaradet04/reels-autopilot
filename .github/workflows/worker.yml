name: worker

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

# One run at a time; a run started while another is busy waits instead of overlapping.
concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Cache fonts
        uses: actions/cache@v4
        with:
          path: assets/fonts
          key: fonts-kanit-v1

      - run: pip install -r worker/requirements.txt

      - name: Run one tick
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          FB_GRAPH_VERSION: ${{ vars.FB_GRAPH_VERSION || 'v23.0' }}
          WORK_DIR: ${{ runner.temp }}/work
        run: python -m worker tick
